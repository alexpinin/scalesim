<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Squares</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .total-display {
            text-align: center;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .total-display .total-value {
            color: #e74c3c;
        }

        .total-display .total-secondary {
            font-size: 14px;
            font-weight: normal;
            color: #7f8c8d;
        }

        .container {
            display: flex;
            align-items: flex-end;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            border: 2px solid #2980b9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            color: white;
        }

        .line-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            position: relative;
        }

        .line-label {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .line-note {
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            max-width: 100px;
            position: absolute;
            top: 100%;
            margin-top: 5px;
        }

        .square-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .processing-label {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #27ae60;
            margin-bottom: 5px;
        }

        .line {
            width: 100px;
            height: 4px;
            background-color: #2c3e50;
        }

        .control-panel {
            margin-top: 40px;
            padding: 20px;
            background-color: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        .control-panel h3 {
            margin: 0 0 15px 0;
            color: black;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch-label {
            font-size: 14px;
            color: black;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3498db;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .cache-group {
            display: flex;
            align-items: flex-end;
        }

        .cache-group.hidden {
            display: none;
        }

        .direct-line-container {
            display: none;
        }

        .direct-line-container.visible {
            display: flex;
        }

        /* Stacked backend styles */
        .backend-stack {
            position: relative;
            width: 100px;
            height: 100px;
            align-self: flex-start;
        }

        .backend-stack .square {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.3s, opacity 0.3s;
        }

        .backend-stack .square:nth-child(1) { z-index: 5; }
        .backend-stack .square:nth-child(2) { z-index: 4; transform: translate(6px, -6px); opacity: 0.85; }
        .backend-stack .square:nth-child(3) { z-index: 3; transform: translate(12px, -12px); opacity: 0.7; }
        .backend-stack .square:nth-child(4) { z-index: 2; transform: translate(18px, -18px); opacity: 0.55; }
        .backend-stack .square:nth-child(5) { z-index: 1; transform: translate(24px, -24px); opacity: 0.4; }

        .instances-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #9b59b6;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            z-index: 10;
        }

        /* Load meter styles */
        .load-meter {
            width: 100px;
            height: 8px;
            background-color: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 1px solid #bdc3c7;
        }

        .load-meter-fill {
            height: 100%;
            width: 0%;
            background-color: #27ae60;
            transition: width 0.3s, background-color 0.3s;
        }

        .load-meter-label {
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #7f8c8d;
            margin-bottom: 3px;
        }

        /* Multi-line styles */
        .multi-line-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            position: relative;
        }

        .lines-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .connection-count {
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #e74c3c;
            font-weight: bold;
            position: absolute;
            top: 100%;
            margin-top: 3px;
        }

        /* Slider styles */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .slider-label {
            font-size: 14px;
            color: black;
            min-width: 140px;
        }

        .slider-value {
            font-size: 14px;
            color: black;
            font-weight: bold;
            min-width: 30px;
        }

        input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="total-display" id="total-display">
            Total: <span class="total-value">34ms</span> <span class="total-secondary">(hit) / 44ms (miss)</span>
        </div>
        <div class="container">
            <div class="square-container">
                <span class="processing-label">&nbsp;</span>
                <div class="square">Web browser</div>
            </div>
            <div class="line-container">
                <span class="line-label">25ms</span>
                <div class="line"></div>
            </div>
            <div class="square-container">
                <span class="processing-label">1ms</span>
                <div class="square">Load balancer</div>
            </div>
            <div class="multi-line-container" id="lb-backend-line">
                <span class="line-label">1ms</span>
                <div class="lines-wrapper" id="lines-wrapper">
                    <div class="line"></div>
                </div>
                <span class="connection-count" id="connection-count">1 conn</span>
            </div>
            <div class="square-container" id="backend-container">
                <span class="load-meter-label">Load: <span id="load-percent">1%</span> <span id="load-per-instance">(per instance)</span></span>
                <div class="load-meter">
                    <div class="load-meter-fill" id="load-meter-fill"></div>
                </div>
                <span class="processing-label">5ms</span>
                <div class="backend-stack" id="backend-stack">
                    <div class="square">Backend</div>
                    <span class="instances-badge" id="instances-badge">x1</span>
                </div>
            </div>
            <div class="line-container direct-line-container" id="direct-line">
                <span class="line-label">10ms</span>
                <div class="line"></div>
            </div>
            <div class="cache-group" id="cache-group">
                <div class="line-container">
                    <span class="line-label">2ms</span>
                    <div class="line"></div>
                </div>
                <div class="square-container" id="cache-container">
                    <span class="load-meter-label">Hit rate: <span id="cache-hit-rate">80%</span></span>
                    <div class="load-meter cache-meter">
                        <div class="load-meter-fill cache-meter-fill" id="cache-meter-fill"></div>
                    </div>
                    <span class="processing-label">&nbsp;</span>
                    <div class="square">Cache</div>
                </div>
                <div class="line-container">
                    <span class="line-label">10ms</span>
                    <div class="line"></div>
                    <span class="line-note">only on cache miss</span>
                </div>
            </div>
            <div class="square-container">
                <span class="processing-label">&nbsp;</span>
                <div class="square">Database</div>
            </div>
        </div>

        <div class="control-panel">
            <h3>Control Panel</h3>
            <div class="switch-container">
                <span class="switch-label">Cache</span>
                <label class="switch">
                    <input type="checkbox" id="cache-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="slider-container">
                <span class="slider-label">Concurrent connections:</span>
                <input type="range" id="connections-slider" min="1" max="1000" value="1">
                <span class="slider-value" id="connections-value">1</span>
            </div>
            <div class="slider-container" id="cache-hit-rate-container">
                <span class="slider-label">Cache hit rate:</span>
                <input type="range" id="cache-hit-rate-slider" min="0" max="100" value="80">
                <span class="slider-value" id="cache-hit-rate-value">80%</span>
            </div>
            <div class="slider-container">
                <span class="slider-label">Backend instances:</span>
                <input type="range" id="instances-slider" min="1" max="5" value="1">
                <span class="slider-value" id="instances-value">1</span>
            </div>
            <div class="slider-container">
                <span class="slider-label">Server capacity:</span>
                <input type="range" id="capacity-slider" min="10" max="500" value="100" step="10">
                <span class="slider-value" id="capacity-value">100 conn</span>
            </div>
        </div>
    </div>

    <script>
        const cacheToggle = document.getElementById('cache-toggle');
        const cacheGroup = document.getElementById('cache-group');
        const directLine = document.getElementById('direct-line');
        const totalDisplay = document.getElementById('total-display');
        const connectionsSlider = document.getElementById('connections-slider');
        const connectionsValue = document.getElementById('connections-value');
        const linesWrapper = document.getElementById('lines-wrapper');
        const connectionCount = document.getElementById('connection-count');
        const loadMeterFill = document.getElementById('load-meter-fill');
        const loadPercent = document.getElementById('load-percent');
        const cacheHitRateSlider = document.getElementById('cache-hit-rate-slider');
        const cacheHitRateValue = document.getElementById('cache-hit-rate-value');
        const cacheHitRateDisplay = document.getElementById('cache-hit-rate');
        const cacheMeterFill = document.getElementById('cache-meter-fill');
        const cacheHitRateContainer = document.getElementById('cache-hit-rate-container');
        const instancesSlider = document.getElementById('instances-slider');
        const instancesValue = document.getElementById('instances-value');
        const instancesBadge = document.getElementById('instances-badge');
        const backendStack = document.getElementById('backend-stack');
        const loadPerInstance = document.getElementById('load-per-instance');
        const capacitySlider = document.getElementById('capacity-slider');
        const capacityValue = document.getElementById('capacity-value');

        function updateTotal() {
            if (cacheToggle.checked) {
                // Cache enabled: 25ms + 1ms + 1ms + 5ms + 2ms = 34ms (hit), + 10ms = 44ms (miss)
                totalDisplay.innerHTML = 'Total: <span class="total-value">34ms</span> <span class="total-secondary">(hit) / 44ms (miss)</span>';
            } else {
                // No cache: 25ms + 1ms + 1ms + 5ms + 10ms = 42ms
                totalDisplay.innerHTML = 'Total: <span class="total-value">42ms</span>';
            }
        }

        function updateCacheHitRate(rate) {
            cacheHitRateValue.textContent = rate + '%';
            cacheHitRateDisplay.textContent = rate + '%';
            cacheMeterFill.style.width = rate + '%';

            // Color based on hit rate (higher is better)
            if (rate >= 70) {
                cacheMeterFill.style.backgroundColor = '#27ae60'; // Green
            } else if (rate >= 40) {
                cacheMeterFill.style.backgroundColor = '#f39c12'; // Yellow/Orange
            } else {
                cacheMeterFill.style.backgroundColor = '#e74c3c'; // Red
            }

            // Recalculate backend load
            updateLoad();
        }

        function updateInstances(count) {
            instancesValue.textContent = count;
            instancesBadge.textContent = 'x' + count;

            // Update visual stack
            const existingSquares = backendStack.querySelectorAll('.square');
            existingSquares.forEach(sq => sq.remove());

            for (let i = 0; i < count; i++) {
                const square = document.createElement('div');
                square.className = 'square';
                square.textContent = 'Backend';
                backendStack.insertBefore(square, instancesBadge);
            }

            // Recalculate load
            updateLoad();
        }

        function updateConnections(count) {
            // Update the displayed value
            connectionsValue.textContent = count;
            connectionCount.textContent = count + ' conn';

            // Update the lines (show up to 5 visual lines)
            const visualLines = Math.min(Math.ceil(count / 20), 5);
            linesWrapper.innerHTML = '';
            for (let i = 0; i < visualLines; i++) {
                const line = document.createElement('div');
                line.className = 'line';
                linesWrapper.appendChild(line);
            }

            // Recalculate load
            updateLoad();
        }

        function updateCapacity(capacity) {
            capacityValue.textContent = capacity + ' conn';
            updateLoad();
        }

        function updateLoad() {
            const connections = parseInt(connectionsSlider.value);
            const instances = parseInt(instancesSlider.value);
            const serverCapacity = parseInt(capacitySlider.value);

            // Calculate effective load based on cache status and hit rate
            let effectiveConnections;
            if (cacheToggle.checked) {
                const cacheHitRate = parseInt(cacheHitRateSlider.value) / 100;
                // Cache hits = 20% load (light), cache misses = 100% load (heavy, needs DB)
                // Formula: connections * (cacheHitRate * 0.2 + (1 - cacheHitRate) * 1.0)
                // Simplified: connections * (1 - 0.8 * cacheHitRate)
                effectiveConnections = connections * (1 - 0.8 * cacheHitRate);
            } else {
                // No cache: every request hits DB, full load
                effectiveConnections = connections;
            }

            // Total capacity = server capacity * number of instances
            // Load per instance = effective connections / instances / server capacity * 100
            const totalCapacity = serverCapacity * instances;
            let loadPercentage = Math.min(100, Math.round((effectiveConnections / totalCapacity) * 100));

            loadMeterFill.style.width = loadPercentage + '%';
            loadPercent.textContent = loadPercentage + '%';
            loadPerInstance.textContent = instances > 1 ? '(per instance)' : '';

            // Update load meter color based on percentage
            if (loadPercentage < 50) {
                loadMeterFill.style.backgroundColor = '#27ae60'; // Green
            } else if (loadPercentage < 80) {
                loadMeterFill.style.backgroundColor = '#f39c12'; // Yellow/Orange
            } else {
                loadMeterFill.style.backgroundColor = '#e74c3c'; // Red
            }
        }

        cacheToggle.addEventListener('change', function() {
            if (this.checked) {
                cacheGroup.classList.remove('hidden');
                directLine.classList.remove('visible');
                cacheHitRateContainer.style.display = 'flex';
            } else {
                cacheGroup.classList.add('hidden');
                directLine.classList.add('visible');
                cacheHitRateContainer.style.display = 'none';
            }
            updateTotal();
            updateLoad();
        });

        connectionsSlider.addEventListener('input', function() {
            updateConnections(parseInt(this.value));
        });

        cacheHitRateSlider.addEventListener('input', function() {
            updateCacheHitRate(parseInt(this.value));
        });

        instancesSlider.addEventListener('input', function() {
            updateInstances(parseInt(this.value));
        });

        capacitySlider.addEventListener('input', function() {
            updateCapacity(parseInt(this.value));
        });

        // Initialize
        updateConnections(1);
        updateCacheHitRate(80);
        updateInstances(1);
        updateCapacity(100);
    </script>
</body>
</html>
